<script>

// SCRIPT DE COLISIONES

const rig = document.querySelector('#rig');
const sensor = document.querySelector('#sensor');

let lastValidPosition = new THREE.Vector3();

AFRAME.registerComponent('col-check',{
tick:function(){
const raycaster = sensor.components.raycaster;
const currentPosition = rig.object3D.position;
const movementDirection = new THREE.Vector3()
.copy(currentPosition)
.sub(lastValidPosition)
.normalize();

if(movementDirection.length()>0){
  sensor.setAttribute('raycaster','direction',movementDirection);
  if(raycaster.intersections.length>0){
    rig.object3D.position.copy(lastValidPosition);
  }else{
    lastValidPosition.copy(currentPosition);
  }
}else{
  lastValidPosition.copy(currentPosition);
}
}
});

// TELEPORTS

const mover1 = document.querySelector("#rig");
const teleport1 = document.querySelector("#teleport1");

// Posición 1 a la que quieres teletransportarte

    mover1.setAttribute("position", destino1);
});

// CAMBIO DEL TEXTO 1 AL TOCAR EL BUS 1

const texto1 = document.querySelector("#texto1");

bus1.addEventListener("click", () => {
    bus1.setAttribute("position", nuevaPos);

    // CAMBIAR TEXTO
    texto1.setAttribute("value", "HAZ CLICK DONDE QUIERES VIAJAR");
});

// CAMBIO DEL TEXTO 2 AL TOCAR EL BUS 2

const texto2 = document.querySelector("#texto2");

bus2.addEventListener("click", () => {

// PATRICIO HABLANDO

const patricio = document.querySelector("#patricio1");
const textoPatricio = document.querySelector("#textoPatricio");

// contador de clicks
let contadorClicks = 0;

patricio.addEventListener("click", () => {
    contadorClicks++;

    // mostrar texto
    textoPatricio.setAttribute("visible", true);

    if (contadorClicks === 1) {
        textoPatricio.setAttribute("value", "JE JE JE JE JE");
    } else if (contadorClicks === 2) {
        textoPatricio.setAttribute("value", "VETE DE MI CASA BOB");
    } else if (contadorClicks === 3) {
        textoPatricio.setAttribute("value", "NO QUIERO QUE ENTRES, ESTOY ENFADADO CONTIGO");
    } else {
