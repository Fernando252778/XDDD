<html>
  <head>
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  </head>
  <body>
  <a-scene cursor="rayOrigin: mouse">
        <a-assets>
          <img id="fons" src="assets/cielo.jpg" />
          <img id="texturaterra" src="assets/suelo.jpg" />
          <img id="amarillo" src="assets/amarillo.jpg" />     
          <img id="messi" src="assets/messi.jpg" /> 
          <img id="balon" src="assets/balonn.jpg" /> 
          <img id="marcador" src="assets/marcador.jpg" />
          <img id="arbitro" src="assets/arbitro.jpg" />
          <img id="cristiano" src="assets/cristiano.jpg" />
          <a-asset-item id="mesii" src="assets/messi.glb"></a-asset-item>
          <a-asset-item id="porteriaa" src="assets/porteria.glb"></a-asset-item>



        </a-assets>
        <a-sky src="#fons"></a-sky>
        <a-plane position="0 0 0" rotation="-90 0 0" width="100" height="100" src="#texturaterra"></a-plane>
        <a-sphere id="esmou" position="-8 10 15" rotation="10 70 30" radius="5" src="#amarillo" ></a-sphere>
        <a-cylinder id="smou" position="5 2.6 10" rotation ="0 39 0" radius="" height="5" src="#messi" ></a-cylinder>
        <a-cylinder id="messi2" position="-20 2.6 10" rotation ="0 39 0" radius="" height="5" src="#cristiano" ></a-cylinder>
        <a-sphere id="balonn" position="-18 1 10" rotation="10 70 30" radius="1" src="#balon" ></a-sphere>
        <a-plane id="marcadorr" position="5 4 -8" rotation="0 0 0" width="10" height="3"  src="#marcador"></a-plane>
        <a-cylinder id="arbitroo" position="-9 2.6 20" rotation ="0 39 0" radius="" height="5" src="#arbitro" ></a-cylinder>
        <a-entity gltf-model="#mesii" position="0 0 -5" scale="0.02 0.02 0.02" animation="property: position; dur: 2000; from: 0 0 -5; to: 0 0 5; dir: alternate; loop: true" >        
        <a-entity gltf-model="#porteriaa" position="0 0 -5" scale="1.02 1.02 1.02" animation="property: position; dur: 2000; from: 0 0 -5; to: 0 0 5; dir: alternate; loop: true" >        
        </a-entity>



        </a-scene>
  </body>
</html>
        <script>
          let unobjecte = document.querySelector("#esmou");
       
          unobjecte.addEventListener("click", () => {            
            unobjecte.setAttribute("animation", {
              property: "position",
              to: "-50 40 50",
              dur: 4000
            });
          });
        </script>
        <script>
          let messi = document.querySelector("#smou");
       
          messi.addEventListener("click", () => {            
            messi.setAttribute("animation", {
              property: "rotation",
              to: "0 360 0",
              dur: 4000,
              loop: true
            });
          });
        </script>

        <script>
          let balonn = document.querySelector("#balonn");

              dur: 4000,
              loop: true
            });
          });
        </script>

            });
          });
        </script>

            });
          });
        </script>

         <script>
