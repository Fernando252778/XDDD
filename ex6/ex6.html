<html>
  <head>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script>
        AFRAME.registerComponent("mylink", {
        init: function() {  
         this.el.addEventListener("click", (e) => {              
            window.location = this.data.href;      
           })
        }
      })
    </script>


  </head>
  <body>
  <a-scene cursor="rayOrigin: mouse">
    <a-assets>
      <img id="imgSortida" src="blanco.jpg" >
      <img id="imgCasa" src="casadelsusto.jpg" >
      <a-asset-item id="dracula" src="assets2/dracula/scene.gltf"></a-asset-item>
    </a-assets>
   
    <a-entity camera look-controls wasd-controls="false">
    <!-- fuseTimeout = el temps que triga en fer click des de que es posiciona sobre un objecte-->
     <a-entity cursor="fuse: true; fuseTimeout: 2000"
           position="0 0 10"
           geometry="primitive: ring; radiusInner: 0.02; radiusOuter: 0.03"
           material="color: red; shader: flat"
           animation="property: components.material.material.color;
                 type: color;
                 to: white;
                 dur: 1000;
                 dir: alternate;
                 loop: true">
     </a-entity>
    </a-entity>


   
   
      <a-sky src="#imgCasa"></a-sky>
        
       </a-sphere>
      <a-entity gltf-model="#dracula" position="-50 -3.5 10" scale="0.02 0.02 0.02" rotation="0 -260 0"
             animation="property: position; dur: 6000; from: -129 -3.5 27; to: 0 -3 0; dir: alternate; loop: true" mylink="href: https://fernando252778.github.io/XDDD/ex5/ex5.html;">        
      </a-entity>
      <a-plane position="20 1 -3.90" src="#imgSortida" rotation="0 -90 0"  transparent="true" mylink="https://fernando252778.github.io/XDDD/;"></a-plane>
    </a-scene>
  </body>
</html>
